# Diagnostic probes of CTC training instability (first 150 of the 480-step schedule, same LR schedule).
# Results go to results/diag/ (traces: runs/<run>_s<seed>/trace.jsonl). Run with scripts/run_cpu.sh DIAG=1.
base: cpu.yaml
results_dir: results/diag
train:
  stop_step: 150
  eval_every: 50
runs:
  gru_old:                # last round's recipe, unchanged
    model: gru
    data: {input_scale: 1.0}
    train: {warmup_steps: 50, grad_clip: 10.0, curriculum_steps: 0}
    model_overrides: {blank_bias: null}
  gru_fixed:              # this round's recipe (cpu.yaml defaults)
    model: gru
schedule:
  - [gru_old, 1]
  - [gru_fixed, 1]
