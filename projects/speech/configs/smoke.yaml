# Fast end-to-end check of the whole pipeline (~15 min on a laptop CPU): tiny time budgets,
# 2 training sessions, a small LM. Numbers produced with this config are meaningless.
base: cpu.yaml
results_dir: ../../data/speech/smoke_results
data:
  sessions: [t15.2023.08.18, t15.2023.08.27]
  heldout_session: t15.2024.03.15
train:
  max_minutes: 0.4
  eval_every: 5
lm:
  build_name: built_smoke
  max_owt_docs: 300
eval:
  n_tune: 10
  alphas: [0.8]
  betas: [0.0, 1.0]
  betas_lexicon: [0.0]
  gammas: [0.0, 0.5]
calibration:
  n_sentences: [5, 10]
  repeats: 1
  steps: 2
robustness:
  drop_fractions: [0.0, 0.3]
  n_masks: 1
schedule:
  - [gru_aug, 0]
  - [gru_aug, 1]
  - [conformer_aug, 0]
  - [gru_bi_aug, 0]
report:
  main_system: gru_aug_ens
  posterior_run: gru_aug_s0
